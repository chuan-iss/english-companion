<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>English Companion 配对</title><style>body{max-width:550px;margin:60px auto;background:#f6f5f0;color:#233e39;font:15px/1.8 system-ui}input,button{padding:10px;border:1px solid #c9d5c9;border-radius:7px}input[type=text]{width:100%;box-sizing:border-box}button{background:#233e39;color:white;cursor:pointer}label{display:block;margin:20px 0}small{color:#657769}</style></head><body><h1>连接你的悬浮助手</h1><p>先启动本地助手，在「连接与使用说明」点击「复制配对码」，然后粘贴到这里。</p><input id="token" type="text" placeholder="本机配对码" autocomplete="off"><label>悬停触发时间 <input id="hover" type="number" min="200" max="2000" step="50" value="450"> 毫秒</label><label><input id="enabled" type="checkbox" checked> 划词后显示「Polish / Translate」菜单</label><button id="save">保存并测试连接</button><p id="status" role="status"></p><small>快捷键：Ctrl + Shift + Y。可在 chrome://extensions/shortcuts 修改。安装后请刷新已经打开的网页。仅在触发时把选区与局部上下文发送到本机；助手生成时才发送给 OpenAI。</small><script src="options.js"></script></body></html>
